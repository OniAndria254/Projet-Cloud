services:
  laravel_app:
    container_name: laravel_app
    build:
      context: ./Authentification
      dockerfile: Dockerfile
    ports:
      - "8000:80" 
    volumes:
      - ./Authentification:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: cloud
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        until pg_isready -h db -p 5432 -U postgres; do
          echo 'Waiting for database...';
          sleep 2;
        done &&
        php artisan key:generate --force &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        touch /var/www/html/storage/ready &&
        apache2-foreground"
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/storage/ready"]
      interval: 10s
      retries: 5
      start_period: 10s

  spring_app:
    container_name: spring_app
    build:
      context: ./SpringUI
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cloud
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      LARAVEL_API_URL: http://laravel_app:80
    depends_on:
      laravel_app:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: laravel_db
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud"]
      interval: 10s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
