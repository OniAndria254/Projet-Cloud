<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Historique des opérations</title>
    <!-- Bibliothèques et polices communes -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      /* Styles communs */
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background-color: #0d1117;
        color: #c9d1d9;
        transition: background-color 0.3s, color 0.3s;
      }
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        background-color: #161b22;
        transition: background-color 0.3s;
      }
      .navbar .nav-links {
        display: flex;
        align-items: center;
        gap: 1.5rem;
      }
      .navbar .nav-links a {
        color: #c9d1d9;
        text-decoration: none;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .navbar .nav-links a:hover {
        color: #58a6ff;
      }
      .navbar .right-section {
        display: flex;
        align-items: center;
        gap: 1rem;
        position: relative;
      }
      .navbar .right-section .profile-dropdown {
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .navbar .right-section img {
        width: 40px;
        border-radius: 50%;
      }
      .dropdown-menu {
        display: none;
        position: absolute;
        top: 60px;
        right: 0;
        background-color: #21262d;
        border-radius: 5px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        z-index: 1000;
      }
      .dropdown-menu a {
        display: block;
        padding: 10px 20px;
        color: #c9d1d9;
        text-decoration: none;
      }
      .dropdown-menu a:hover {
        background-color: #161b22;
      }
      .theme-toggle {
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .theme-toggle input {
        display: none;
      }
      .theme-toggle .slider {
        width: 50px;
        height: 25px;
        background-color: #ccc;
        border-radius: 25px;
        position: relative;
        transition: background-color 0.3s;
      }
      .theme-toggle .slider:before {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background-color: #fff;
        border-radius: 50%;
        top: 50%;
        left: 5px;
        transform: translateY(-50%);
        transition: transform 0.3s;
      }
      .theme-toggle input:checked + .slider {
        background-color: #007bff;
      }
      .theme-toggle input:checked + .slider:before {
        transform: translate(25px, -50%);
      }
      .theme-toggle .icon {
        font-size: 1.5rem;
        margin-left: 10px;
        color: #c9d1d9;
      }
      /* Styles pour le mode clair */
      .light-theme {
        background-color: #f0f0f0;
        color: #000;
      }
      .light-theme .navbar {
        background-color: #e0e0e0;
      }
      .light-theme .navbar .nav-links a {
        color: #000;
      }
      .light-theme .navbar .nav-links a:hover {
        color: #007bff;
      }
      .light-theme .btn-outline-light {
        color: #000;
        border-color: #000;
      }
      .light-theme .btn-outline-light:hover {
        background-color: #000;
        color: #fff;
      }
      /* Styles spécifiques à la page d'historique */
      .container {
        padding: 2rem;
      }
      .filter-label {
        font-weight: bold;
      }
      .operation-item {
        background-color: #161b22;
        border: none;
        margin-bottom: 1rem;
        border-radius: 5px;
        padding: 1rem;
        transition: background-color 0.3s, color 0.3s;
        cursor: pointer;
      }
      .operation-item:hover {
        background-color: #21262d;
      }
      .user-img {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        margin-right: 1rem;
      }
      .operation-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .operation-user {
        display: flex;
        align-items: center;
      }
      /* Règles spécifiques pour le mode clair appliquées aux opérations */
      .light-theme .operation-item {
        background-color: #f8f9fa; /* fond clair */
        color: #000;              /* texte en noir */
      }
      .light-theme .operation-item:hover {
        background-color: #e9ecef;
      }
    </style>
  </head>
  <body>
    <!-- Nav-Bar -->
    <nav class="navbar">
      <div class="nav-links">
        <a href="/transaction/buy-sell">
          <i class="fas fa-dollar-sign"></i> Transaction
        </a>
        <a href="/admin/transactions">
          <i class="fas fa-check-circle"></i> Validation
        </a>
        <a href="/graphic/graphe">
          <i class="fas fa-chart-line"></i> Market
        </a>
        <a href="/history">
          <i class="fas fa-history"></i> Trade History
        </a>
      </div>
      <div class="right-section">
        <label class="theme-toggle">
          <input id="themeToggle" onclick="toggleTheme()" type="checkbox" />
          <span class="slider"></span>
          <i class="fas fa-moon icon" id="themeIcon"></i>
        </label>

        <a href="/transaction/depositWithdraw">
          <button class="btn btn-outline-light">
            <i class="fas fa-wallet"></i> Wallet
          </button>
        </a>

    
        <div class="profile-dropdown" id="profileDropdown">
          <img alt="User Profile Picture" id="profileImage" src="/assets/img/profil.png" />
          <span id="profileName">Invité</span>
          <div class="dropdown-menu" id="dropdownMenu">
            <a href="/auth/logout">Disconnect</a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h1>Historique des opérations</h1>

   
      <div class="row my-4">
        
        <div class="col-md-3">
          <label for="dateFilter" class="filter-label">Filtrer par date</label>
          <input type="date" id="dateFilter" class="form-control" />
        </div>
    
        <div class="col-md-3">
          <label for="timeFilter" class="filter-label">Filtrer par heure</label>
          <input type="time" id="timeFilter" class="form-control" />
        </div>
   
        <div class="col-md-3">
          <label for="cryptoFilter" class="filter-label">Filtrer par Crypto</label>
          <select id="cryptoFilter" class="form-control">
            <option value="">Tous</option>
            <option value="bitcoin">Bitcoin</option>
            <option value="ethereum">Ethereum</option>
       
          </select>
        </div>
  
        <div class="col-md-3">
          <label for="userFilter" class="filter-label">Filtrer par utilisateur</label>
          <select id="userFilter" class="form-control">
            <option value="">Tous</option>
            <option value="user1">Utilisateur 1</option>
            <option value="user2">Utilisateur 2</option>
  
          </select>
        </div>
      </div>


      <div class="row mb-4">
        <div class="col-md-12 text-right">
          <button id="applyFilters" class="btn btn-primary">
            Valider
          </button>
        </div>
      </div>

     
      <div id="historyList">
  
        <div class="operation-item" onclick="filterByUser('user1')">
          <div class="operation-header">
            <div class="operation-user">
              <img src="/assets/img/profil.png" alt="User 1" class="user-img" />
              <h5 class="mb-0">Utilisateur 1</h5>
            </div>
            <small>2025-02-06 14:35</small>
          </div>
          <p class="mt-2 mb-0">Opération : Achat de Bitcoin - Quantité : 0.5 BTC</p>
        </div>


        <div class="operation-item" onclick="filterByUser('user2')">
          <div class="operation-header">
            <div class="operation-user">
              <img src="/assets/img/profil.png" alt="User 2" class="user-img" />
              <h5 class="mb-0">Utilisateur 2</h5>
            </div>
            <small>2025-02-05 10:20</small>
          </div>
          <p class="mt-2 mb-0">Opération : Vente d'Ethereum - Quantité : 2 ETH</p>
        </div>

      </div>
    </div>

    <!-- Scripts JavaScript -->
    <script>
      function toggleTheme() {
        document.body.classList.toggle("light-theme");
        var themeIcon = document.getElementById("themeIcon");
        if (document.body.classList.contains("light-theme")) {
          themeIcon.classList.remove("fa-moon");
          themeIcon.classList.add("fa-sun");
        } else {
          themeIcon.classList.remove("fa-sun");
          themeIcon.classList.add("fa-moon");
        }
      }

      var profileDropdown = document.getElementById("profileDropdown");
      profileDropdown.addEventListener("click", function () {
        var dropdownMenu = document.getElementById("dropdownMenu");
        dropdownMenu.style.display =
          dropdownMenu.style.display === "block" ? "none" : "block";
      });
      document.addEventListener("click", function (event) {
        var dropdownMenu = document.getElementById("dropdownMenu");
        var profileDropdown = document.getElementById("profileDropdown");
        if (
          !profileDropdown.contains(event.target) &&
          !dropdownMenu.contains(event.target)
        ) {
          dropdownMenu.style.display = "none";
        }
      });


      document.getElementById("dateFilter").addEventListener("change", function () {
        console.log("Filtrer par date :", this.value);

      });

      document.getElementById("timeFilter").addEventListener("change", function () {
        console.log("Filtrer par heure :", this.value);

      });

      document.getElementById("cryptoFilter").addEventListener("change", function () {
        console.log("Filtrer par crypto :", this.value);

      });

      document.getElementById("userFilter").addEventListener("change", function () {
        console.log("Filtrer par utilisateur :", this.value);
  
      });


      document.getElementById("applyFilters").addEventListener("click", function () {
  
        var date = document.getElementById("dateFilter").value;
        var time = document.getElementById("timeFilter").value;
        var crypto = document.getElementById("cryptoFilter").value;
        var user = document.getElementById("userFilter").value;
        console.log("Filtres appliqués :", { date, time, crypto, user });
      
      });

      // Fonction pour filtrer par utilisateur lors du clic sur un item
      function filterByUser(userId) {
        console.log("Filtrer l'historique pour l'utilisateur :", userId);
     
      }
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
